name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Scala suites + PySpark e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: sbt/setup-sbt@v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Spark distribution
        id: spark-cache
        uses: actions/cache@v4
        with:
          path: tools/spark-4.1.2-bin-hadoop3
          key: spark-4.1.2-bin-hadoop3

      - name: Download Spark distribution (local-cluster tests)
        if: steps.spark-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tools
          curl -sL https://archive.apache.org/dist/spark/spark-4.1.2/spark-4.1.2-bin-hadoop3.tgz \
            | tar xz -C tools

      - name: Cache coursier
        uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('build.sbt', 'project/build.properties') }}

      - name: Scala test suites
        run: sbt -batch test

      - name: Package jar
        run: sbt -batch package

      - name: PySpark end-to-end
        env:
          PYSPARK_PYTHON: python
        run: sh python/tests/run.sh

  docs:
    name: Scaladoc API HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: sbt/setup-sbt@v1
      - name: Cache coursier
        uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: coursier-${{ hashFiles('build.sbt', 'project/build.properties') }}
      - name: Generate Scaladoc
        run: sbt -batch doc
      - name: Upload API docs
        uses: actions/upload-artifact@v4
        with:
          name: scaladoc-api
          path: target/scala-2.13/api
      # To host these at a public URL, enable GitHub Pages (Settings > Pages >
      # Source: GitHub Actions) and add a deploy-pages step.

  docker-notebooks:
    name: Docker image + notebook validation
    runs-on: ubuntu-latest
    # the image build is heavy; gate it to main pushes and manual runs
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t titian -f docker/Dockerfile .

      - name: Execute all notebooks headlessly
        run: docker run --rm titian validate
